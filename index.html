<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日系極簡隨行行程表</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            beigetone: {
              50: '#FBF9F5',
              100: '#F5F2EB',
              200: '#EBE5D8',
              300: '#DED5C1',
              400: '#C5B89D',
              800: '#5C5243',
              900: '#3D362C',
            },
            accent: {
              sage: '#5C5243',
              terracotta: '#D08C72',
              sand: '#E6D5B8'
            }
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
            maru: ['"Zen Maru Gothic"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F5F2EB;
      color: #3D362C;
      font-family: 'Noto Sans TC', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    input[type="date"], input[type="time"] {
      -webkit-appearance: none;
      min-width: 0;
    }
    input[type="date"]::-webkit-date-and-time-value, input[type="time"]::-webkit-date-and-time-value {
      text-align: center;
    }
    .dragging {
      opacity: 0.5;
      transform: scale(0.98);
    }
    /* 防止手機長按選取文字與出現彈窗 */
    .touch-none-select {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: pan-y;
    }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen bg-beigetone-100 shadow-2xl relative pb-24">

<div id="app">

  <!-- ================= 密碼驗證解鎖畫面 ================= -->
  <div v-if="!isAuthenticated" class="fixed inset-0 bg-beigetone-100 z-50 flex flex-col items-center justify-center p-6 text-center">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm border border-beigetone-200">
      <div class="w-16 h-16 bg-beigetone-200 text-beigetone-800 rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-xl font-bold text-beigetone-900 mb-1">私人行程解鎖</h2>
      <p class="text-xs text-beigetone-400 mb-6">此行程網頁受密碼保護，請輸入通行密碼</p>
      
      <form @submit.prevent="checkPassword">
        <input type="text" inputmode="numeric" v-model="passwordInput" placeholder="請輸入密碼" 
               class="w-full bg-beigetone-50 border border-beigetone-200 rounded-2xl px-4 py-3 text-center text-lg tracking-widest font-bold focus:outline-none focus:border-beigetone-800 mb-4">
        
        <button type="submit" class="w-full bg-beigetone-800 text-white font-bold py-3 rounded-2xl shadow-md hover:bg-beigetone-900 transition active:scale-95">
          解鎖進入
        </button>
      </form>

      <div v-if="passwordError" class="text-xs text-red-500 font-medium mt-3">
        <i class="fa-solid fa-circle-exclamation mr-1"></i> 密碼錯誤，請重新輸入
      </div>
    </div>
  </div>

  <!-- ================= 主 Web App 畫面 ================= -->
  <template v-else>
    <!-- 頁首 Banner -->
    <div class="relative w-full h-[220px] bg-beigetone-300 overflow-hidden">
      <img :src="bannerUrl" class="w-full h-full object-cover object-center" alt="旅遊 Banner">
      
      <label class="absolute top-4 left-4 bg-white/70 backdrop-blur-md px-3 py-1.5 rounded-full text-xs text-beigetone-800 shadow cursor-pointer hover:bg-white transition">
        <i class="fa-solid fa-camera mr-1"></i> 更換封面
        <input type="file" @change="uploadBanner" class="hidden" accept="image/*">
      </label>
    </div>

    <!-- 主內容區域 -->
    <div class="relative -mt-5 bg-beigetone-50 rounded-t-[28px] px-4 pt-6 pb-12 z-10 min-h-[calc(100vh-200px)] shadow-inner">
      
      <!-- 1. 每日行程表 -->
      <div v-if="currentTab === 'itinerary'">
        <div class="flex gap-2 items-center overflow-x-auto no-scrollbar mb-6 pb-2">
          <button v-for="(day, index) in days" :key="index" @click="selectedDayIndex = index"
            :class="selectedDayIndex === index ? 'bg-beigetone-800 text-white shadow-md' : 'bg-white text-beigetone-800 border border-beigetone-200'"
            class="flex-shrink-0 min-w-[76px] px-2.5 py-2 rounded-2xl flex flex-col items-center justify-center transition relative group">
            
            <span class="text-xs font-bold tracking-wide">Day {{ index + 1 }}</span>
            <span class="text-xs font-semibold font-maru mt-0.5 whitespace-nowrap opacity-90">
              {{ day.dateDisplay || '9/6 (日)' }}
            </span>
          </button>
          
          <button @click="addNewDay" class="flex-shrink-0 w-12 h-14 bg-white text-beigetone-800 border border-dashed border-beigetone-400 rounded-2xl flex items-center justify-center hover:bg-beigetone-100 transition">
            <i class="fa-solid fa-plus text-lg"></i>
          </button>
        </div>

        <div class="bg-white/80 backdrop-blur rounded-2xl p-3 mb-6 flex items-center justify-between border border-beigetone-200/60 shadow-sm">
          <span class="text-xs font-bold text-beigetone-800">
            <i class="fa-solid fa-calendar-day mr-1.5 text-accent-terracotta"></i>Day {{ selectedDayIndex + 1 }} - {{ days[selectedDayIndex]?.dateDisplay }}
          </span>
          
          <div class="flex items-center gap-1.5">
            <button @click="openDateModal" class="text-xs px-2.5 py-1 bg-beigetone-100 text-beigetone-800 rounded-full font-medium hover:bg-beigetone-200 transition">
              <i class="fa-solid fa-pen mr-1"></i>修改日期
            </button>
            <button v-if="days.length > 1" @click="deleteCurrentDay" class="text-xs px-2.5 py-1 bg-red-50 text-red-600 rounded-full font-medium hover:bg-red-100 transition">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>

        <div class="relative border-l-2 border-beigetone-300 ml-2 pl-0 space-y-6 my-2">
          
          <div v-if="currentDaySchedule.length === 0" class="text-center py-8 text-xs text-beigetone-400 pl-4">
            尚無行程，點選右下角「+」開始新增吧！
          </div>

          <div v-for="(item, idx) in currentDaySchedule" :key="item.id" class="relative group pl-5 flex flex-col items-start">
            
            <div class="absolute -left-[11px] top-0 min-w-[50px] px-2 py-0.5 rounded-full bg-beigetone-800 text-white text-[11px] font-bold font-mono text-center shadow border-2 border-beigetone-50 flex items-center justify-center z-10">
              {{ item.time || '--:--' }}
            </div>

            <div class="w-full mt-7">
              <div v-if="item.category === '航班'" class="bg-[#EFE6DC] border border-[#DED5C1] text-beigetone-900 p-4 rounded-2xl shadow-sm relative">
                <div class="flex justify-between items-center mb-2">
                  <div class="flex items-center gap-2">
                    <span class="text-[11px] bg-accent-terracotta text-white px-2 py-0.5 rounded-md font-bold">航班資訊</span>
                  </div>
                  <button @click="openEditModal(item)" class="text-beigetone-400 hover:text-beigetone-900 p-1">
                    <i class="fa-solid fa-pen-to-square text-sm"></i>
                  </button>
                </div>

                <div class="flex justify-between items-center my-2 text-center">
                  <div class="w-1/3">
                    <div class="text-lg font-bold font-maru tracking-wide text-beigetone-900">
                      {{ item.depAirport || 'TPE' }}
                      <span v-if="item.depCn" class="text-[10px] font-normal text-beigetone-800 block">{{ item.depCn }}</span>
                    </div>
                    <div class="text-xs font-bold text-accent-terracotta mt-0.5">{{ item.depTime || '08:15' }}</div>
                  </div>

                  <div class="w-1/3 flex flex-col items-center justify-center">
                    <span class="text-[10px] font-extrabold text-beigetone-800 tracking-wider bg-beigetone-200/70 px-2 py-0.5 rounded-full mb-1">
                      {{ item.flightNo || 'JX800' }}
                    </span>
                    <i class="fa-solid fa-plane text-beigetone-800 text-base my-0.5"></i>
                  </div>

                  <div class="w-1/3">
                    <div class="text-lg font-bold font-maru tracking-wide text-beigetone-900">
                      {{ item.arrAirport || 'NRT' }}
                      <span v-if="item.arrCn" class="text-[10px] font-normal text-beigetone-800 block">{{ item.arrCn }}</span>
                    </div>
                    <div class="text-xs font-bold text-accent-terracotta mt-0.5">{{ item.arrTime || '12:30' }}</div>
                  </div>
                </div>
              </div>

              <div v-else class="bg-white rounded-2xl p-4 shadow-sm border border-beigetone-200/80 relative">
                <div class="flex justify-between items-center mb-1.5">
                  <div class="flex items-center gap-2">
                    <span class="text-[11px] bg-beigetone-100 text-beigetone-800 px-2 py-0.5 rounded-md font-medium">{{ item.category }}</span>
                  </div>
                  
                  <button @click="openMap(item.mapUrl, item.name)" class="text-xs bg-beigetone-100 hover:bg-beigetone-200 text-beigetone-800 px-2.5 py-1 rounded-full font-medium flex items-center gap-1 transition">
                    <i class="fa-solid fa-compass text-accent-terracotta"></i> 導航
                  </button>
                </div>

                <h4 class="font-bold text-beigetone-900 text-base mb-1.5 break-words">{{ item.name }}</h4>
                
                <div class="text-xs text-beigetone-800 space-y-1 mb-1">
                  <div v-if="item.ticket" class="flex items-center gap-1.5">
                    <i class="fa-solid fa-ticket text-beigetone-400"></i> {{ item.ticket }}
                  </div>
                  <div v-if="item.note" class="text-beigetone-400 mt-1 pl-2.5 border-l-2 border-beigetone-200 italic break-words whitespace-pre-wrap">
                    {{ item.note }}
                  </div>
                </div>

                <button @click="openEditModal(item)" class="absolute bottom-3 right-3 text-beigetone-300 hover:text-beigetone-800 p-1">
                  <i class="fa-solid fa-pen-to-square"></i>
                </button>
              </div>
            </div>

          </div>
        </div>
      </div>

      <!-- 2. 行前準備 Tab -->
      <div v-if="currentTab === 'preparation'" class="space-y-4">
        <div class="bg-beigetone-800 text-white rounded-2xl p-4 shadow-sm flex items-center justify-between">
          <div>
            <h3 class="font-bold text-base">行李與行前準備</h3>
            <p class="text-xs text-beigetone-300 mt-0.5">可按住握把圖示拖拉調整順序，點擊可展開項目</p>
          </div>
          <button @click="openPrepCategoryModal()" class="bg-white text-beigetone-800 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-beigetone-100 transition">
            <i class="fa-solid fa-plus mr-1"></i>新增類別
          </button>
        </div>

        <div v-if="prepCategories.length === 0" class="text-center py-12 text-xs text-beigetone-400">
          目前還沒有行前準備項目，點選右上角「新增類別」開始規劃吧！
        </div>

        <!-- 可拖拉圖卡區域 -->
        <div class="space-y-3">
          <div v-for="(cat, index) in prepCategories" :key="cat.id"
               :data-index="index"
               draggable="true"
               @dragstart="onDragStart(index)"
               @dragover.prevent
               @drop="onDrop(index)"
               :class="{ 'dragging': draggedIndex === index }"
               class="prep-card bg-white rounded-2xl border border-beigetone-200 shadow-sm overflow-hidden transition-transform duration-150 touch-none-select">
            
            <!-- 類別圖卡 header -->
            <div @click="togglePrepCategory(cat.id)" class="p-4 bg-beigetone-50 flex items-center justify-between cursor-pointer hover:bg-beigetone-100/60 transition">
              <div class="flex items-center gap-2.5">
                <i class="fa-solid fa-grip-lines text-beigetone-300 cursor-grab active:cursor-grabbing mr-1 p-2 touch-none" 
                   @click.stop 
                   @touchstart="onTouchStart(index, $event)"
                   @touchmove="onTouchMove($event)"
                   @touchend="onTouchEnd"
                   title="按住拖拉排序"></i>
                <i :class="cat.icon || 'fa-solid fa-suitcase'" class="text-accent-terracotta text-base"></i>
                <span class="font-bold text-sm text-beigetone-900">{{ cat.title }}</span>
                <span class="text-xs text-beigetone-400">({{ getCompletedPrepCount(cat) }}/{{ cat.items.length }})</span>
              </div>
              <div class="flex items-center gap-1.5">
                <button @click.stop="openPrepCategoryModal(cat)" class="text-beigetone-400 hover:text-beigetone-800 p-1 text-xs" title="編輯類別">
                  <i class="fa-solid fa-pen"></i>
                </button>
                <button @click.stop="openAddPrepItemModal(cat)" class="text-xs bg-beigetone-200/80 text-beigetone-800 px-2.5 py-1 rounded-lg font-medium hover:bg-beigetone-300 transition">
                  + 項目
                </button>
                <button @click.stop="deletePrepCategory(cat.id)" class="text-beigetone-300 hover:text-red-500 p-1 text-xs" title="刪除類別">
                  <i class="fa-solid fa-trash"></i>
                </button>
                <i :class="expandedPrepCategories.includes(cat.id) ? 'fa-solid fa-chevron-up' : 'fa-solid fa-chevron-down'" class="text-beigetone-400 text-xs ml-1"></i>
              </div>
            </div>

            <!-- 可隱藏式清單列表 -->
            <div v-if="expandedPrepCategories.includes(cat.id)" class="p-4 border-t border-beigetone-100 space-y-2.5">
              <div v-if="cat.items.length === 0" class="text-xs text-beigetone-400 text-center py-2">
                此類別暫無項目，點擊右上角新增。
              </div>

              <div v-for="item in cat.items" :key="item.id" class="flex items-center justify-between group">
                <label class="flex items-center gap-2.5 cursor-pointer flex-1">
                  <input type="checkbox" v-model="item.completed" class="w-4 h-4 rounded text-beigetone-800 focus:ring-beigetone-800 border-beigetone-300">
                  <span :class="item.completed ? 'line-through text-beigetone-300' : 'text-beigetone-800'" class="text-xs font-medium break-all">
                    {{ item.name }}
                  </span>
                </label>
                <button @click="deletePrepItem(cat.id, item.id, item.name)" class="text-beigetone-300 hover:text-red-500 text-xs p-1" title="刪除項目">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 3. 實用日語 Tab -->
      <div v-if="currentTab === 'japanese'" class="space-y-4">
        <template v-if="!selectedJpCategory">
          <div class="bg-accent-terracotta/10 border border-accent-terracotta/30 rounded-2xl p-4 text-xs text-beigetone-800 flex items-start gap-2.5">
            <i class="fa-solid fa-circle-info text-accent-terracotta text-base mt-0.5"></i>
            <div>
              <span class="font-bold block mb-0.5">旅遊溝通小幫手</span>
              請點選下方任一情境圖卡，即可查看該分類的豐富實用日語短句，並可點擊發音或全螢幕放大出示。
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div v-for="(group, idx) in japanesePhrases" :key="idx" 
                 @click="selectedJpCategory = group"
                 class="bg-white hover:bg-beigetone-100 active:scale-95 transition rounded-2xl p-5 shadow-sm border border-beigetone-200 flex flex-col items-center text-center cursor-pointer group">
              <div class="w-12 h-12 rounded-2xl bg-beigetone-100 text-accent-terracotta flex items-center justify-center text-xl mb-3 group-hover:bg-accent-terracotta group-hover:text-white transition">
                <i :class="group.icon"></i>
              </div>
              <h4 class="font-bold text-sm text-beigetone-900 mb-1">{{ group.category }}</h4>
              <span class="text-[11px] text-beigetone-400">{{ group.items.length }} 則常用短句</span>
            </div>
          </div>
        </template>

        <template v-else>
          <div class="flex items-center justify-between mb-2">
            <button @click="selectedJpCategory = null" class="text-xs bg-beigetone-200/80 hover:bg-beigetone-200 text-beigetone-800 px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5 transition">
              <i class="fa-solid fa-arrow-left"></i> 返回情境總覽
            </button>
            <span class="text-xs font-bold text-accent-terracotta bg-accent-terracotta/10 px-3 py-1 rounded-xl">
              {{ selectedJpCategory.category }}
            </span>
          </div>

          <div class="space-y-3">
            <div v-for="(item, iidx) in selectedJpCategory.items" :key="iidx" 
                 class="bg-white p-4 rounded-2xl shadow-sm border border-beigetone-200 flex items-center justify-between gap-3">
              <div @click="showLargeJapanese(item)" class="flex-1 cursor-pointer">
                <div class="font-bold text-base text-beigetone-900 font-maru">{{ item.jp }}</div>
                <div class="text-xs text-beigetone-400 mt-0.5">{{ item.kana }}</div>
                <div class="text-xs font-bold text-beigetone-800 mt-1">{{ item.zh }}</div>
              </div>

              <div class="flex items-center gap-1.5 flex-shrink-0">
                <button @click="speakJapanese(item.jp)" class="w-10 h-10 rounded-xl bg-accent-terracotta/10 hover:bg-accent-terracotta/20 text-accent-terracotta flex items-center justify-center transition active:scale-90" title="播放日文發音">
                  <i class="fa-solid fa-volume-high text-sm"></i>
                </button>
                <button @click="showLargeJapanese(item)" class="w-10 h-10 rounded-xl bg-beigetone-100 hover:bg-beigetone-200 text-beigetone-800 flex items-center justify-center transition active:scale-90" title="全螢幕放大">
                  <i class="fa-solid fa-expand text-sm"></i>
                </button>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- 4. 購物清單 Tab -->
      <div v-if="currentTab === 'shopping'">
        <div class="grid grid-cols-2 gap-3 items-start">
          <div v-for="item in shoppingList" :key="item.id" class="bg-white rounded-2xl p-3 shadow-sm border border-beigetone-200 flex flex-col justify-between relative group h-full">
            <div class="flex-1">
              <div class="w-full h-32 bg-beigetone-100 rounded-xl overflow-hidden mb-2.5 relative flex-shrink-0">
                <img v-if="item.image" :src="item.image" class="w-full h-full object-cover">
                <div v-else class="w-full h-full flex items-center justify-center text-beigetone-300">
                  <i class="fa-solid fa-bag-shopping text-3xl"></i>
                </div>
              </div>

              <div class="font-bold text-sm text-beigetone-900 leading-snug break-words mb-1.5">{{ item.name }}</div>

              <div v-if="item.price" class="text-xs font-bold text-accent-terracotta font-maru mb-2">
                ¥ {{ Number(item.price).toLocaleString() }}
              </div>

              <div v-if="item.location" class="text-xs text-beigetone-800 pt-2 border-t border-beigetone-100 space-y-1.5">
                <div class="text-[11px] text-beigetone-800 break-words leading-tight flex items-start gap-1">
                  <i class="fa-solid fa-location-dot text-beigetone-400 mt-0.5 flex-shrink-0"></i>
                  <span>{{ item.location }}</span>
                </div>

                <button @click="openMap(item.mapUrl, item.location)" class="w-full bg-beigetone-100 hover:bg-beigetone-200 text-beigetone-800 px-2 py-1 rounded-xl text-[11px] font-medium flex items-center justify-center gap-1 transition">
                  <i class="fa-solid fa-compass text-accent-terracotta text-[10px]"></i> 導航地點
                </button>
              </div>
            </div>

            <button @click="openEditModal(item)" class="absolute top-2 right-2 bg-black/40 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs backdrop-blur-xs hover:bg-black/60 transition z-10">
              <i class="fa-solid fa-pen text-[10px]"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- 5. 累積花費 Tab -->
      <div v-if="currentTab === 'expense'" class="space-y-4">
        <div class="bg-beigetone-800 text-white rounded-2xl p-5 shadow-lg text-center">
          <div class="text-xs text-beigetone-300 font-medium mb-1">累積總花費</div>
          <div class="text-3xl font-bold font-maru">¥ {{ totalExpense.toLocaleString() }}</div>
          <div class="text-xs text-beigetone-300 mt-1">約 NT$ {{ (totalExpense * 0.215).toFixed(0).toLocaleString() }}</div>
        </div>

        <div class="space-y-2">
          <div v-for="exp in expenses" :key="exp.id" class="bg-white rounded-2xl p-3 shadow-sm border border-beigetone-200 flex justify-between items-center gap-3">
            <div class="flex items-center gap-3 overflow-hidden">
              <div v-if="exp.image" @click="previewImg(exp.image)" class="w-14 h-14 rounded-xl overflow-hidden bg-beigetone-100 flex-shrink-0 cursor-pointer relative group">
                <img :src="exp.image" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-black/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-white text-xs">
                  <i class="fa-solid fa-magnifying-glass"></i>
                </div>
              </div>

              <div class="min-w-0">
                <div class="font-bold text-sm text-beigetone-900 break-words leading-snug">{{ exp.name }}</div>

      ]);

      watch(days, (val) => localStorage.setItem('trip_days_v2', JSON.stringify(val)), { deep: true });
      watch(scheduleData, (val) => localStorage.setItem('trip_schedule_v3', JSON.stringify(val)), { deep: true });
      watch(driveList, (val) => localStorage.setItem('trip_drive', JSON.stringify(val)), { deep: true });
      watch(shoppingList, (val) => localStorage.setItem('trip_shopping', JSON.stringify(val)), { deep: true });
      watch(expenses, (val) => localStorage.setItem('trip_expenses', JSON.stringify(val)), { deep: true });
      watch(prepCategories, (val) => localStorage.setItem('trip_prep_categories_v2', JSON.stringify(val)), { deep: true });

      const formData = ref({});
      
      const currentDaySchedule = computed(() => {
        const list = scheduleData.value[selectedDayIndex.value] || [];
        return list.slice().sort((a, b) => {
          if (!a.time) return 1;
          if (!b.time) return -1;
          return a.time.localeCompare(b.time);
        });
      });

      const totalExpense = computed(() => expenses.value.reduce((acc, cur) => acc + Number(cur.amount || 0), 0));

      const togglePrepCategory = (id) => {
        const idx = expandedPrepCategories.value.indexOf(id);
        if (idx > -1) {
          expandedPrepCategories.value.splice(idx, 1);
        } else {
          expandedPrepCategories.value.push(id);
        }
      };

      const getCompletedPrepCount = (cat) => {
        return cat.items.filter(i => i.completed).length;
      };

      const openAddPrepItemModal = (cat) => {
        const name = prompt(`在「${cat.title}」新增項目名稱：`);
        if (name && name.trim()) {
          cat.items.push({
            id: Date.now().toString(),
            name: name.trim(),
            completed: false
          });
        }
      };

      const deletePrepCategory = (catId) => {
        if (confirm('確定要刪除整個類別及其項目嗎？')) {
          prepCategories.value = prepCategories.value.filter(c => c.id !== catId);
        }
      };

      // 刪除個別項目時新增確認跳窗
      const deletePrepItem = (catId, itemId, itemName) => {
        if (confirm(`確定要刪除項目「${itemName || '此項目'}」嗎？`)) {
          const cat = prepCategories.value.find(c => c.id === catId);
          if (cat) {
            cat.items = cat.items.filter(i => i.id !== itemId);
          }
        }
      };

      const openMap = (mapUrl, name) => {
        if (mapUrl && mapUrl.trim() !== '') {
          window.open(mapUrl.trim(), '_blank');
        } else if (name && name.trim() !== '') {
          window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name.trim())}`, '_blank');
        }
      };

      const callPhone = (phone) => {
        if (phone) window.location.href = `tel:${phone.replace(/[^0-9+]/g, '')}`;
      };

      const previewImg = (src) => {
        previewImageSrc.value = src;
      };

      const showLargeJapanese = (item) => {
        largeJapaneseItem.value = item;
      };

      const speakJapanese = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'ja-JP';
          utterance.rate = 0.9;
          window.speechSynthesis.speak(utterance);
        } else {
          alert('您的瀏覽器不支援語音播放功能');
        }
      };

      const addNewDay = () => {
        const input = prompt(`請輸入 Day ${days.value.length + 1} 的日期與星期：`, `9/${6 + days.value.length} (日)`);
        if (input) {
          days.value.push({ dateDisplay: input });
          selectedDayIndex.value = days.value.length - 1;
        }
      };

      const openDateModal = () => {
        const now = new Date();
        const year = now.getFullYear();
        dateInputVal.value = `${year}-09-06`;
        showDateModal.value = true;
      };

      const saveDayDate = () => {
        if (!dateInputVal.value) return;
        const parts = dateInputVal.value.split('-');
        if (parts.length === 3) {
          const m = parseInt(parts[1], 10);
          const d = parseInt(parts[2], 10);
          const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
          const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
          const wk = weekdays[dateObj.getDay()];
          days.value[selectedDayIndex.value].dateDisplay = `${m}/${d} (${wk})`;
        }
        showDateModal.value = false;
      };

      const deleteCurrentDay = () => {
        if (confirm(`確定要刪除 Day ${selectedDayIndex.value + 1} 的整天行程嗎？`)) {
          days.value.splice(selectedDayIndex.value, 1);
          delete scheduleData.value[selectedDayIndex.value];
          selectedDayIndex.value = Math.max(0, selectedDayIndex.value - 1);
        }
      };

      const uploadBanner = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (evt) => bannerUrl.value = evt.target.result;
          reader.readAsDataURL(file);
        }
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (evt) => formData.value.image = evt.target.result;
          reader.readAsDataURL(file);
        }
      };

      const selectAddType = (type) => {
        showAddMenu.value = false;
        openAddModal(type);
      };

      const openAddModal = (type = null) => {
        isEditing.value = false;
        if (currentTab.value === 'itinerary') formData.value = { category: type || '景點', time: '10:00' };
        else if (currentTab.value === 'drive') formData.value = { type: type || '租車' };
        else if (currentTab.value === 'expense') formData.value = { category: '飲食', payMethod: '現金' };
        else formData.value = {};
        showModal.value = true;
      };

      const openEditModal = (item) => {
        isEditing.value = true;
        formData.value = { ...item };
        showModal.value = true;
      };

      const saveData = () => {
        if (currentTab.value === 'itinerary') {
          if (!scheduleData.value[selectedDayIndex.value]) scheduleData.value[selectedDayIndex.value] = [];
          if (isEditing.value) {
            const idx = scheduleData.value[selectedDayIndex.value].findIndex(i => i.id === formData.value.id);
            if (idx !== -1) scheduleData.value[selectedDayIndex.value][idx] = { ...formData.value };
          } else {
            scheduleData.value[selectedDayIndex.value].push({ ...formData.value, id: Date.now().toString() });
          }
        } else if (currentTab.value === 'drive') {
          if (isEditing.value) {
            const idx = driveList.value.findIndex(i => i.id === formData.value.id);
            if (idx !== -1) driveList.value[idx] = { ...formData.value };
          } else {
            driveList.value.push({ ...formData.value, id: Date.now().toString() });
          }
        } else if (currentTab.value === 'shopping') {
          if (isEditing.value) {
            const idx = shoppingList.value.findIndex(i => i.id === formData.value.id);
            if (idx !== -1) shoppingList.value[idx] = { ...formData.value };
          } else {
            shoppingList.value.push({ ...formData.value, id: Date.now().toString() });
          }
        } else if (currentTab.value === 'expense') {
          if (isEditing.value) {
            const idx = expenses.value.findIndex(i => i.id === formData.value.id);
            if (idx !== -1) expenses.value[idx] = { ...formData.value };
          } else {
            expenses.value.push({ ...formData.value, id: Date.now().toString(), date: new Date().toISOString().split('T')[0] });
          }
        }
        showModal.value = false;
      };

      const confirmDelete = () => {
        if (confirm('確定要刪除這筆資料嗎？')) {
          if (currentTab.value === 'itinerary') {
            scheduleData.value[selectedDayIndex.value] = scheduleData.value[selectedDayIndex.value].filter(i => i.id !== formData.value.id);
          } else if (currentTab.value === 'drive') {
            driveList.value = driveList.value.filter(i => i.id !== formData.value.id);
          } else if (currentTab.value === 'shopping') {
            shoppingList.value = shoppingList.value.filter(i => i.id !== formData.value.id);
          } else if (currentTab.value === 'expense') {
            expenses.value = expenses.value.filter(i => i.id !== formData.value.id);
          }
          showModal.value = false;
        }
      };

      return {
        isAuthenticated, passwordInput, passwordError, checkPassword,
        currentTab, showNavMenu, showAddMenu, switchTab, bannerUrl, selectedDayIndex, days,
        scheduleData, currentDaySchedule, driveList, shoppingList, expenses, totalExpense, japanesePhrases,
        prepCategories, expandedPrepCategories, togglePrepCategory, getCompletedPrepCount, deletePrepCategory, deletePrepItem,
        prepIcons, showPrepCatModal, editingPrepCatId, prepCatForm, openPrepCategoryModal, savePrepCategory, openAddPrepItemModal,
        draggedIndex, onDragStart, onDrop, onTouchStart, onTouchMove, onTouchEnd,
        selectedJpCategory, showModal, showDateModal, dateInputVal, isEditing, formData, previewImageSrc, largeJapaneseItem, uploadBanner, handleImageUpload,
        openMap, callPhone, previewImg, showLargeJapanese, speakJapanese, selectAddType, openAddModal, openEditModal, saveData, confirmDelete,
        addNewDay, openDateModal, saveDayDate, deleteCurrentDay
      };
    }
  }).mount('#app');
</script>
</body>
</html>
