<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日系極簡多功能行程表 (主機/訪客模式 + PeerJS 同步)</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            beigetone: {
              50: '#FBF9F5',
              100: '#F5F2EB',
              200: '#EBE5D8',
              300: '#DED5C1',
              400: '#C5B89D',
              800: '#5C5243',
              900: '#3D362C',
            },
            accent: {
              sage: '#5C5243',
              terracotta: '#D08C72',
              sand: '#E6D5B8'
            }
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
            maru: ['"Zen Maru Gothic"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F5F2EB;
      color: #3D362C;
      font-family: 'Noto Sans TC', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    input[type="date"], input[type="time"] {
      -webkit-appearance: none;
      min-width: 0;
    }
    input[type="date"]::-webkit-date-and-time-value, input[type="time"]::-webkit-date-and-time-value {
      text-align: center;
    }
    .dragging {
      opacity: 0.5;
      transform: scale(0.98);
    }
    .touch-none-select {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen bg-beigetone-100 shadow-2xl relative pb-24">

<div id="app">

  <!-- ================= 1. 身分驗證與解鎖畫面 ================= -->
  <div v-if="!isAuthenticated" class="fixed inset-0 bg-beigetone-100 z-50 flex flex-col items-center justify-center p-6 text-center">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm border border-beigetone-200 space-y-4">
      <div class="w-16 h-16 bg-beigetone-200 text-beigetone-800 rounded-full flex items-center justify-center text-2xl mx-auto">
        <i class="fa-solid fa-lock"></i>
      </div>
      <div>
        <h2 class="text-xl font-bold text-beigetone-900 mb-1">行程系統登入</h2>
        <p class="text-xs text-beigetone-400">請選擇您的身分進入檢視或管理行程[cite: 9]</p>
      </div>
      
      <!-- 主機登入表單 -->
      <form @submit.prevent="checkHostPassword" class="space-y-3 pt-2">
        <input type="password" inputmode="numeric" v-model="passwordInput" placeholder="請輸入主機編輯密碼" 
               class="w-full bg-beigetone-50 border border-beigetone-200 rounded-2xl px-4 py-3 text-center text-sm tracking-widest font-bold focus:outline-none focus:border-beigetone-800">
        
        <button type="submit" class="w-full bg-beigetone-800 text-white font-bold py-3 rounded-2xl shadow-md hover:bg-beigetone-900 transition active:scale-95 text-sm">
          <i class="fa-solid fa-pen-to-square mr-1.5"></i> 以主機（編輯者）身分進入
        </button>
      </form>

      <div v-if="passwordError" class="text-xs text-red-500 font-medium">
        <i class="fa-solid fa-circle-exclamation mr-1"></i> 密碼錯誤，請重新輸入
      </div>

      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-beigetone-200"></div>
        <span class="flex-shrink mx-4 text-xs text-beigetone-400">或</span>
        <div class="flex-grow border-t border-beigetone-200"></div>
      </div>

      <!-- 訪客登入表單 (支援輸入主機 Peer ID 進行同步) -->
      <div class="space-y-2 pt-1">
        <input type="text" v-model="visitorPeerIdInput" placeholder="輸入主機代碼 (Peer ID) 進行同步" 
               class="w-full bg-beigetone-50 border border-beigetone-200 rounded-2xl px-3 py-2.5 text-center text-xs font-mono focus:outline-none focus:border-beigetone-800">
        <button @click="enterAsVisitor" class="w-full bg-beigetone-100 hover:bg-beigetone-200 text-beigetone-800 font-bold py-3 rounded-2xl transition active:scale-95 text-sm flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-eye"></i> 以訪客（即時同步檢視）身分進入
        </button>
      </div>
    </div>
  </div>

  <!-- ================= 身份與同步提示橫幅 (固定頂部) ================= -->
  <div v-if="isAuthenticated" class="bg-beigetone-900 text-white px-4 py-1.5 text-[11px] flex justify-between items-center z-50 sticky top-0 shadow-sm">
    <div class="flex items-center gap-1.5 overflow-hidden">
      <span class="w-2 h-2 rounded-full flex-shrink-0" :class="isHost ? 'bg-emerald-400 animate-pulse' : (syncConnected ? 'bg-emerald-400' : 'bg-amber-400 animate-ping')"></span>
      <span class="truncate">
        身分：<strong class="font-bold">{{ isHost ? '主機 (編輯者)' : '訪客 (檢視端)' }}</strong>
        <span v-if="isHost && myPeerId" class="ml-1 text-[10px] text-beigetone-300 font-mono">(代碼: {{ myPeerId }})</span>
        <span v-if="!isHost" class="ml-1 text-[10px] text-beigetone-300">({{ syncConnected ? '已連線同步' : '連線中...' }})</span>
      </span>
    </div>
    <div class="flex items-center gap-2 flex-shrink-0">
      <button v-if="isHost" @click="showShareModal = true" class="bg-beigetone-800 text-beigetone-100 hover:text-white px-2 py-0.5 rounded text-[10px] border border-beigetone-700">
        <i class="fa-solid fa-share-nodes mr-1"></i>同步連線
      </button>
      <button @click="logout" class="underline text-beigetone-300 hover:text-white transition">切換</button>
    </div>
  </div>

  <!-- 主機分享連線資訊 Modal -->
  <div v-if="showShareModal && isHost" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-[28px] p-6 space-y-4 shadow-2xl text-center">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base text-beigetone-900">訪客同步連線設定</h3>
        <button @click="showShareModal = false" class="text-beigetone-400 hover:text-beigetone-800"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <p class="text-xs text-beigetone-400">請將以下「主機代碼」提供給訪客，訪客輸入後即可即時同步您的所有操作：</p>
      <div class="bg-beigetone-50 p-3 rounded-2xl border border-beigetone-200 font-mono text-sm font-bold text-beigetone-900 select-all">
        {{ myPeerId || '連線準備中...' }}
      </div>
      <button @click="showShareModal = false" class="w-full bg-beigetone-800 text-white font-bold py-2.5 rounded-xl text-xs">確定</button>
    </div>
  </div>

  <!-- ================= 2. 行程專案選擇大廳 ================= -->
  <template v-if="isAuthenticated && !currentProjectId">
    <div class="p-6 space-y-6">
      <div class="bg-white p-5 rounded-3xl shadow-sm border border-beigetone-200">
        <h1 class="text-lg font-bold text-beigetone-900">我的旅程專案</h1>
        <p class="text-xs text-beigetone-400 mt-0.5">{{ isHost ? '選擇一個專案進入編輯，或建立新旅程' : '選擇一個專案以檢視詳細行程內容' }}[cite: 9]</p>
      </div>

      <!-- 進行中 / 即將到來專案列表 -->
      <div class="space-y-3">
        <h3 class="text-xs font-bold text-beigetone-800 tracking-wider px-1">進行中 / 即將出遊</h3>[cite: 9]
        <div v-for="proj in activeProjects" :key="proj.id" 
             @click="selectProject(proj.id)"
             class="bg-white rounded-3xl p-4 shadow-sm border border-beigetone-200 hover:border-beigetone-800 transition cursor-pointer flex items-center gap-4 group relative overflow-hidden">
          
          <div class="w-20 h-20 rounded-2xl overflow-hidden bg-beigetone-100 flex-shrink-0 relative">
            <img :src="proj.bannerUrl || 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1920&auto=format&fit=crop'" class="w-full h-full object-cover">
          </div>

          <div class="flex-1 min-w-0 pr-12">
            <h3 class="font-bold text-base text-beigetone-900 truncate group-hover:text-beigetone-800 transition">{{ proj.title }}</h3>
            <p class="text-xs text-accent-terracotta font-medium mt-0.5">{{ proj.dateRange || '未設定日期' }}[cite: 9]</p>
            <p class="text-[11px] text-beigetone-400 mt-1 truncate">{{ proj.description || '點擊進入詳細行程' }}[cite: 9]</p>
          </div>

          <div v-if="isHost" class="absolute top-3 right-3 flex items-center gap-1">
            <button @click.stop="openEditProjectModal(proj)" class="text-beigetone-300 hover:text-beigetone-800 p-2 text-xs transition" title="編輯專案設定">
              <i class="fa-solid fa-pen"></i>
            </button>
            <button @click.stop="deleteProject(proj.id)" class="text-beigetone-300 hover:text-red-500 p-2 text-xs transition" title="刪除專案">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>

        <div v-if="activeProjects.length === 0" class="text-center py-8 text-xs text-beigetone-400 bg-white/50 rounded-2xl border border-dashed border-beigetone-200">
          目前沒有進行中的行程專案[cite: 9]
        </div>
      </div>

      <!-- 已結束專案列表 -->
      <div v-if="endedProjects.length > 0" class="space-y-3 pt-2">
        <h3 class="text-xs font-bold text-beigetone-400 tracking-wider px-1">已結束的專案 (歷史紀錄)</h3>
        <div v-for="proj in endedProjects" :key="proj.id" 
             @click="selectProject(proj.id)"
             class="bg-white/80 rounded-3xl p-4 shadow-sm border border-beigetone-200 hover:border-beigetone-800 transition cursor-pointer flex items-center gap-4 group relative overflow-hidden opacity-80 hover:opacity-100">
          
          <div class="w-20 h-20 rounded-2xl overflow-hidden bg-beigetone-100 flex-shrink-0 relative grayscale">
            <img :src="proj.bannerUrl || 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1920&auto=format&fit=crop'" class="w-full h-full object-cover">
          </div>

          <div class="flex-1 min-w-0 pr-12">
            <div class="flex items-center gap-2">
              <span class="text-[10px] bg-beigetone-200 text-beigetone-800 px-1.5 py-0.5 rounded font-bold">已結束</span>
              <h3 class="font-bold text-base text-beigetone-900 truncate">{{ proj.title }}</h3>
            </div>
            <p class="text-xs text-beigetone-400 font-medium mt-0.5">{{ proj.dateRange || '未設定日期' }}[cite: 9]</p>
            <p class="text-[11px] text-beigetone-400 mt-1 truncate">{{ proj.description || '點擊檢視歷史行程' }}[cite: 9]</p>
          </div>

          <div v-if="isHost" class="absolute top-3 right-3 flex items-center gap-1">
            <button @click.stop="openEditProjectModal(proj)" class="text-beigetone-300 hover:text-beigetone-800 p-2 text-xs transition" title="編輯專案設定">
              <i class="fa-solid fa-pen"></i>
            </button>
            <button @click.stop="deleteProject(proj.id)" class="text-beigetone-300 hover:text-red-500 p-2 text-xs transition" title="刪除專案">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 右下角浮動新增專案按鈕 (+) - 僅主機能見[cite: 9] -->
    <div v-if="isHost" class="fixed bottom-6 right-6 z-40">
      <button @click="openNewProjectModal" class="w-14 h-14 bg-beigetone-800 text-white rounded-full shadow-2xl flex items-center justify-center text-2xl z-40 active:scale-95 transition hover:bg-beigetone-900" title="新增專案">
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>

    <!-- 新增/編輯專案彈窗 -->
    <div v-if="showProjectModal && isHost" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-white w-full max-w-sm rounded-[28px] p-6 space-y-4 shadow-2xl">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-lg text-beigetone-900">{{ isEditingProject ? '編輯行程專案' : '建立新行程專案' }}</h3>[cite: 9]
          <button @click="showProjectModal = false" class="text-beigetone-400 hover:text-beigetone-800"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>

        <div class="space-y-3">
          <div>
            <label class="text-xs font-bold text-beigetone-800 block mb-1">專案名稱</label>
            <input v-model="newProjectForm.title" placeholder="例如：2026 東京賞楓五日遊" class="w-full bg-beigetone-50 border border-beigetone-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-beigetone-800">
          </div>
          <div>
            <label class="text-xs font-bold text-beigetone-800 block mb-1">日期區間備註</label>
            <input v-model="newProjectForm.dateRange" placeholder="例如：2026/09/06 - 2026/09/10" class="w-full bg-beigetone-50 border border-beigetone-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-beigetone-800">
          </div>
          <div>
            <label class="text-xs font-bold text-beigetone-800 block mb-1">簡短描述</label>
            <input v-model="newProjectForm.description" placeholder="例如：秋季限定、自駕遊" class="w-full bg-beigetone-50 border border-beigetone-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-beigetone-800">
          </div>
        </div>

        <div class="flex gap-2 pt-2">
          <button @click="showProjectModal = false" class="w-1/3 bg-beigetone-100 text-beigetone-800 font-bold py-2.5 rounded-xl text-sm">取消</button>
          <button @click="saveProject" class="flex-1 bg-beigetone-800 text-white font-bold py-2.5 rounded-xl text-sm">儲存</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ================= 3. 主 Web App 畫面 (選定特定專案後) ================= -->
  <template v-else-if="isAuthenticated && currentProjectId">
    <!-- 頁首 Banner -->
    <div class="relative w-full h-[220px] bg-beigetone-300 overflow-hidden">
      <img :src="bannerUrl" class="w-full h-full object-cover object-center" alt="旅遊 Banner">[cite: 9]
      
      <!-- 更換封面 (僅主機)[cite: 9] -->
      <label v-if="isHost" class="absolute top-4 left-4 bg-white/70 backdrop-blur-md px-3 py-1.5 rounded-full text-xs text-beigetone-800 shadow cursor-pointer hover:bg-white transition">
        <i class="fa-solid fa-camera mr-1"></i> 更換封面
        <input type="file" @change="uploadBanner" class="hidden" accept="image/*">
      </label>
    </div>

    <!-- 主內容區域 -->
    <div class="relative -mt-5 bg-beigetone-50 rounded-t-[28px] px-4 pt-6 pb-12 z-10 min-h-[calc(100vh-200px)] shadow-inner">
      
      <!-- 1. 每日行程表 -->
      <div v-if="currentTab === 'itinerary'">
        <div class="flex gap-2 items-center overflow-x-auto no-scrollbar mb-6 pb-2">
          <button v-for="(day, index) in days" :key="index" @click="selectedDayIndex = index"
            :class="selectedDayIndex === index ? 'bg-beigetone-800 text-white shadow-md' : 'bg-white text-beigetone-800 border border-beigetone-200'"
            class="flex-shrink-0 min-w-[76px] px-2.5 py-2 rounded-2xl flex flex-col items-center justify-center transition relative group">
            
            <span class="text-xs font-bold tracking-wide">Day {{ index + 1 }}</span>
            <span class="text-xs font-semibold font-maru mt-0.5 whitespace-nowrap opacity-90">
              {{ day.dateDisplay || '9/6 (日)' }}
            </span>
          </button>
          
          <!-- 新增天數 (僅主機)[cite: 9] -->
          <button v-if="isHost" @click="addNewDay" class="flex-shrink-0 w-12 h-14 bg-white text-beigetone-800 border border-dashed border-beigetone-400 rounded-2xl flex items-center justify-center hover:bg-beigetone-100 transition">
            <i class="fa-solid fa-plus text-lg"></i>
          </button>
        </div>

        <div class="bg-white/80 backdrop-blur rounded-2xl p-3 mb-6 flex items-center justify-between border border-beigetone-200/60 shadow-sm">
          <span class="text-xs font-bold text-beigetone-800">
            <i class="fa-solid fa-calendar-day mr-1.5 text-accent-terracotta"></i>Day {{ selectedDayIndex + 1 }} - {{ days[selectedDayIndex]?.dateDisplay }}
          </span>
          
          <!-- 日期修改/刪除 (僅主機)[cite: 9] -->
          <div v-if="isHost" class="flex items-center gap-1.5">
            <button @click="openDateModal" class="text-xs px-2.5 py-1 bg-beigetone-100 text-beigetone-800 rounded-full font-medium hover:bg-beigetone-200 transition">
              <i class="fa-solid fa-pen mr-1"></i>修改日期
            </button>
            <button v-if="days.length > 1" @click="deleteCurrentDay" class="text-xs px-2.5 py-1 bg-red-50 text-red-600 rounded-full font-medium hover:bg-red-100 transition">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>

        <div class="relative border-l-2 border-beigetone-300 ml-2 pl-0 space-y-6 my-2">
          
          <div v-if="currentDaySchedule.length === 0" class="text-center py-8 text-xs text-beigetone-400 pl-4">
            尚無行程，{{ isHost ? '點選右下角「+」開始新增吧！' : '目前主機尚未新增行程內容。' }}[cite: 9]
          </div>

          <div v-for="(item, idx) in currentDaySchedule" :key="item.id" class="relative group pl-5 flex flex-col items-start">
            
            <div class="absolute -left-[11px] top-0 min-w-[50px] px-2 py-0.5 rounded-full bg-beigetone-800 text-white text-[11px] font-bold font-mono text-center shadow border-2 border-beigetone-50 flex items-center justify-center z-10">
              {{ item.time || '--:--' }}
            </div>

            <div class="w-full mt-7">
              <div v-if="item.category === '航班'" class="bg-[#EFE6DC] border border-[#DED5C1] text-beigetone-900 p-4 rounded-2xl shadow-sm relative">
                <div class="flex justify-between items-center mb-2">
                  <div class="flex items-center gap-2">
                    <span class="text-[11px] bg-accent-terracotta text-white px-2 py-0.5 rounded-md font-bold">航班資訊</span>
                  </div>
                  <button v-if="isHost" @click="openEditModal(item)" class="text-beigetone-400 hover:text-beigetone-900 p-1">[cite: 9]
                    <i class="fa-solid fa-pen-to-square text-sm"></i>
                  </button>
                </div>

                <div class="flex justify-between items-center my-2 text-center">
                  <div class="w-1/3">
                    <div class="text-lg font-bold font-maru tracking-wide text-beigetone-900">
                      {{ item.depAirport || 'TPE' }}
                      <span v-if="item.depCn" class="text-[10px] font-normal text-beigetone-800 block">{{ item.depCn }}</span>
                    </div>
                    <div class="text-xs font-bold text-accent-terracotta mt-0.5">{{ item.depTime || '08:15' }}</div>
                  </div>

                  <div class="w-1/3 flex flex-col items-center justify-center">
                    <span class="text-[10px] font-extrabold text-beigetone-800 tracking-wider bg-beigetone-200/70 px-2 py-0.5 rounded-full mb-1">
                      {{ item.flightNo || 'JX800' }}
                    </span>
                    <i class="fa-solid fa-plane text-beigetone-800 text-base my-0.5"></i>
                  </div>

                  <div class="w-1/3">
                    <div class="text-lg font-bold font-maru tracking-wide text-beigetone-900">
                      {{ item.arrAirport || 'NRT' }}
                      <span v-if="item.arrCn" class="text-[10px] font-normal text-beigetone-800 block">{{ item.arrCn }}</span>
                    </div>
                    <div class="text-xs font-bold text-accent-terracotta mt-0.5">{{ item.arrTime || '12:30' }}</div>
                  </div>
                </div>
              </div>

              <div v-else class="bg-white rounded-2xl p-4 shadow-sm border border-beigetone-200/80 relative">
                <div class="flex justify-between items-center mb-1.5">
                  <div class="flex items-center gap-2">
                    <span class="text-[11px] bg-beigetone-100 text-beigetone-800 px-2 py-0.5 rounded-md font-medium">{{ item.category }}</span>
                  </div>
                  
                  <button @click="openMap(item.mapUrl, item.name)" class="text-xs bg-beigetone-100 hover:bg-beigetone-200 text-beigetone-800 px-2.5 py-1 rounded-full font-medium flex items-center gap-1 transition">
                    <i class="fa-solid fa-compass text-accent-terracotta"></i> 導航
                  </button>
                </div>

<script>
  const { createApp, ref, computed, watch, onMounted } = Vue;

  createApp({
    setup() {
      const HOST_PASSWORD = "0214";
      const isAuthenticated = ref(false);
      const userRole = ref('visitor'); // 'host' 或 'visitor'[cite: 9]
      const passwordInput = ref('');
      const passwordError = ref(false);
      const visitorPeerIdInput = ref('');
      
      const isHost = computed(() => userRole.value === 'host');

      // PeerJS 相關變數
      const myPeerId = ref('');
      const syncConnected = ref(false);
      const showShareModal = ref(false);
      let peer = null;
      let conn = null; // 訪客連線到主機的連線物件
      let hostConnections = []; // 主機儲存所有連進來的訪客連線

      const initPeerAsHost = () => {
        try {
          peer = new Peer();
          peer.on('open', (id) => {
            myPeerId.value = id;
          });
          peer.on('connection', (connection) => {
            hostConnections.push(connection);
            syncConnected.value = true;
            // 連線建立時立即傳送目前完整專案資料給新訪客
            connection.on('open', () => {
              connection.send({ type: 'SYNC_ALL', projects: projects.value });
            });
            connection.on('close', () => {
              hostConnections = hostConnections.filter(c => c !== connection);
              if (hostConnections.length === 0) syncConnected.value = false;
            });
          });
        } catch(e) {
          console.error("PeerJS host init error:", e);
        }
      };

      const connectAsVisitorToHost = (hostId) => {
        if (!hostId) return;
        try {
          peer = new Peer();
          peer.on('open', () => {
            conn = peer.connect(hostId.trim());
            conn.on('open', () => {
              syncConnected.value = true;

      const parseProjectEndDate = (dateRangeStr) => {
        if (!dateRangeStr) return new Date(9999, 0, 1);
        const matches = dateRangeStr.match(/(\d{1,4})[\/\.-](\d{1,2})[\/\.-](\d{1,2})|(\d{1,2})[\/\.-](\d{1,2})/g);
        if (matches && matches.length > 0) {
          const lastMatch = matches[matches.length - 1];
          const parts = lastMatch.split(/[\/\.-]/);
          const nowYear = new Date().getFullYear();
          if (parts.length === 3) {
            return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
          } else if (parts.length === 2) {
            return new Date(nowYear, parseInt(parts[0]) - 1, parseInt(parts[1]));
          }
        }
        return new Date(9999, 0, 1);
      };

      const parseProjectStartDate = (dateRangeStr) => {
        if (!dateRangeStr) return new Date(9999, 0, 1);

          if (parts.length === 3) {

        return new Date(9999, 0, 1);

        const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);

        const cardEl = targetEl.closest('.prep-card');
        if (cardEl && cardEl.dataset.index !== undefined) {
          const targetIndex = parseInt(cardEl.dataset.index, 10);
          if (targetIndex !== touchStartIndex.value && !isNaN(targetIndex)) {
