<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日系極簡隨行行程表</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            beige: {
              50: '#FDFBF7',
              100: '#F7F4EE',
              200: '#EFEAE1',
              300: '#E2D9CC',
              400: '#C8B9A6',
              800: '#5C5247',
              900: '#3D352E',
            },
            accent: {
              sage: '#8A9A86',
              terracotta: '#D08C72',
              sand: '#D8C3A5'
            }
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
            maru: ['"Zen Maru Gothic"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F7F4EE;
      color: #3D352E;
      font-family: 'Noto Sans TC', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen bg-beige-100 shadow-2xl relative pb-24">

<div id="app">

  <!-- ================= 密碼驗證解鎖畫面 ================= -->
  <div v-if="!isAuthenticated" class="fixed inset-0 bg-beige-100 z-50 flex flex-col items-center justify-center p-6 text-center">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm border border-beige-200">
      <div class="w-16 h-16 bg-beige-200 text-beige-800 rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-xl font-bold text-beige-900 mb-1">私人行程解鎖</h2>
      <p class="text-xs text-beige-400 mb-6">此行程網頁受密碼保護，請輸入通行密碼</p>
      
      <form @submit.prevent="checkPassword">
        <input type="text" inputmode="numeric" v-model="passwordInput" placeholder="請輸入密碼" 
               class="w-full bg-beige-50 border border-beige-200 rounded-2xl px-4 py-3 text-center text-lg tracking-widest font-bold focus:outline-none focus:border-beige-800 mb-4">
        
        <button type="submit" class="w-full bg-beige-800 text-white font-bold py-3 rounded-2xl shadow-md hover:bg-beige-900 transition active:scale-95">
          解鎖進入
        </button>
      </form>

      <div v-if="passwordError" class="text-xs text-red-500 font-medium mt-3">
        <i class="fa-solid fa-circle-exclamation mr-1"></i> 密碼錯誤，請重新輸入
      </div>
    </div>
  </div>

  <!-- ================= 主 Web App 畫面 ================= -->
  <template v-else>
    <!-- 頁首 Banner -->
    <div class="relative w-full h-[220px] bg-beige-300 overflow-hidden">
      <img :src="bannerUrl" class="w-full h-full object-cover object-center" alt="旅遊 Banner">
      
      <label class="absolute top-4 left-4 bg-white/70 backdrop-blur-md px-3 py-1.5 rounded-full text-xs text-beige-800 shadow cursor-pointer hover:bg-white transition">
        <i class="fa-solid fa-camera mr-1"></i> 更換封面
        <input type="file" @change="uploadBanner" class="hidden" accept="image/*">
      </label>
    </div>

    <!-- 主內容區域 -->
    <div class="relative -mt-5 bg-beige-50 rounded-t-[28px] px-4 pt-6 pb-12 z-10 min-h-[calc(100vh-200px)] shadow-inner">
      
      <!-- 1. 每日行程表 -->
      <div v-if="currentTab === 'itinerary'">
        <div class="flex gap-2 items-center overflow-x-auto no-scrollbar mb-6 pb-2">
          <button v-for="(day, index) in days" :key="index" @click="selectedDayIndex = index"
            :class="selectedDayIndex === index ? 'bg-accent-sage text-white shadow-md' : 'bg-white text-beige-800 border border-beige-200'"
            class="flex-shrink-0 min-w-[76px] px-2.5 py-2 rounded-2xl flex flex-col items-center justify-center transition relative group">
            
            <span class="text-xs font-bold tracking-wide">Day {{ index + 1 }}</span>
            <span class="text-xs font-semibold font-maru mt-0.5 whitespace-nowrap opacity-90">
              {{ day.dateDisplay || '9/6 (日)' }}
            </span>
          </button>
          
          <button @click="addNewDay" class="flex-shrink-0 w-12 h-14 bg-white text-beige-800 border border-dashed border-beige-400 rounded-2xl flex items-center justify-center hover:bg-beige-100 transition">
            <i class="fa-solid fa-plus text-lg"></i>
          </button>
        </div>

        <div class="bg-white/80 backdrop-blur rounded-2xl p-3 mb-4 flex items-center justify-between border border-beige-200/60 shadow-sm">
          <span class="text-xs font-bold text-beige-800">
            <i class="fa-solid fa-calendar-day mr-1.5 text-accent-sage"></i>Day {{ selectedDayIndex + 1 }} - {{ days[selectedDayIndex]?.dateDisplay }}
          </span>
          
          <div class="flex items-center gap-1.5">
            <button @click="editDayDate" class="text-xs px-2.5 py-1 bg-beige-100 text-beige-800 rounded-full font-medium hover:bg-beige-200 transition">
              <i class="fa-solid fa-pen mr-1"></i>修改日期
            </button>
            <button v-if="days.length > 1" @click="deleteCurrentDay" class="text-xs px-2.5 py-1 bg-red-50 text-red-600 rounded-full font-medium hover:bg-red-100 transition">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>

        <div class="space-y-4">
          <div v-for="(item, idx) in currentDaySchedule" :key="item.id" class="relative group">
            
            <div v-if="idx > 0" class="my-2.5 flex items-center justify-center">
              <div class="bg-beige-200/70 text-beige-800 text-[11px] px-3 py-1 rounded-full flex items-center gap-1.5 font-medium">
                <i :class="getTransportIcon(item.transportType)"></i>
                <span>{{ item.transportTime || '約 15 分鐘' }}</span>
              </div>
            </div>

            <!-- 航班卡片 -->
            <div v-if="item.category === '航班'" class="bg-gradient-to-br from-beige-800 to-beige-900 text-white p-5 rounded-2xl shadow-md relative">
              <div class="flex justify-between items-center mb-3">
                <span class="text-xs bg-accent-terracotta text-white px-2.5 py-0.5 rounded-md font-medium">航班資訊</span>
                <button @click="openEditModal(item)" class="text-white/70 hover:text-white p-1">
                  <i class="fa-solid fa-pen-to-square text-sm"></i>
                </button>
              </div>

              <div class="flex justify-between items-center my-2 text-center">
                <div class="w-1/3">
                  <div class="text-xl font-bold font-maru tracking-wide">
                    {{ item.depAirport || 'TPE' }}
                    <span v-if="item.depCn" class="text-xs font-normal text-beige-300 block mt-0.5">{{ item.depCn }}</span>
                  </div>
                  <div class="text-base font-bold text-accent-sand mt-1">{{ item.depTime || '08:15' }}</div>
                </div>

                <div class="w-1/3 flex flex-col items-center justify-center">
                  <span class="text-sm font-extrabold text-white tracking-wider bg-white/10 px-2.5 py-0.5 rounded-full mb-1">
                    {{ item.flightNo || 'JX800' }}
                  </span>
                  <i class="fa-solid fa-plane text-accent-sand text-xl my-1"></i>
                </div>

                <div class="w-1/3">
                  <div class="text-xl font-bold font-maru tracking-wide">
                    {{ item.arrAirport || 'NRT' }}
                    <span v-if="item.arrCn" class="text-xs font-normal text-beige-300 block mt-0.5">{{ item.arrCn }}</span>
                  </div>
                  <div class="text-base font-bold text-accent-sand mt-1">{{ item.arrTime || '12:30' }}</div>
                </div>
              </div>
            </div>

            <!-- 一般行程卡片 -->
            <div v-else class="bg-white rounded-2xl p-4 shadow-sm border border-beige-200/80 relative">
              <div class="flex justify-between items-center mb-1.5">
                <div class="flex items-center gap-2">
                  <span class="w-2 h-2 rounded-full bg-accent-sage"></span>
                  <span class="text-xs text-beige-400 font-medium">{{ item.category }}</span>
                </div>
                
                <button @click="openMap(item.mapUrl, item.name)" class="text-xs bg-beige-100 hover:bg-beige-200 text-beige-800 px-2.5 py-1 rounded-full font-medium flex items-center gap-1 transition">
                  <i class="fa-solid fa-compass text-accent-terracotta"></i> 導航
                </button>
              </div>

              <h4 class="font-bold text-beige-900 text-base mb-2 break-words">{{ item.name }}</h4>
              
              <div class="text-xs text-beige-800 space-y-1 mb-2">
                <div v-if="item.time" class="flex items-center gap-1.5">
                  <i class="fa-regular fa-clock text-beige-400"></i> {{ item.time }}
                </div>
                <div v-if="item.ticket" class="flex items-center gap-1.5">
                  <i class="fa-solid fa-ticket text-beige-400"></i> {{ item.ticket }}
                </div>
                <div v-if="item.note" class="text-beige-400 mt-1 pl-3 border-l-2 border-beige-200 italic break-words">
                  {{ item.note }}
                </div>
              </div>

              <button @click="openEditModal(item)" class="absolute bottom-3 right-3 text-beige-300 hover:text-beige-800 p-1">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
            </div>

          </div>
        </div>
      </div>

      <!-- 2. 實用日語 Tab (支援情境圖卡切換 + 語音播放) -->
      <div v-if="currentTab === 'japanese'" class="space-y-4">
        
        <!-- 情況 A：未選擇情境，顯示四大圖卡首頁 -->
        <template v-if="!selectedJpCategory">
          <div class="bg-accent-sage/10 border border-accent-sage/30 rounded-2xl p-4 text-xs text-beige-800 flex items-start gap-2.5">
            <i class="fa-solid fa-circle-info text-accent-sage text-base mt-0.5"></i>
            <div>
              <span class="font-bold block mb-0.5">旅遊溝通小幫手</span>
              請點選下方任一情境圖卡，即可查看該分類的豐富實用日語短句，並可點擊發音或全螢幕放大出示。
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div v-for="(group, idx) in japanesePhrases" :key="idx" 
                 @click="selectedJpCategory = group"
                 class="bg-white hover:bg-beige-100 active:scale-95 transition rounded-2xl p-5 shadow-sm border border-beige-200 flex flex-col items-center text-center cursor-pointer group">
              <div class="w-12 h-12 rounded-2xl bg-beige-100 text-accent-terracotta flex items-center justify-center text-xl mb-3 group-hover:bg-accent-terracotta group-hover:text-white transition">
                <i :class="group.icon"></i>
              </div>
              <h4 class="font-bold text-sm text-beige-900 mb-1">{{ group.category }}</h4>
              <span class="text-[11px] text-beige-400">{{ group.items.length }} 則常用短句</span>
            </div>
          </div>
        </template>

        <!-- 情況 B：已選擇特定情境，顯示該情境列表 -->
        <template v-else>
          <div class="flex items-center justify-between mb-2">
            <button @click="selectedJpCategory = null" class="text-xs bg-beige-200/80 hover:bg-beige-200 text-beige-800 px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5 transition">
              <i class="fa-solid fa-arrow-left"></i> 返回情境總覽
            </button>
            <span class="text-xs font-bold text-accent-terracotta bg-accent-terracotta/10 px-3 py-1 rounded-xl">
              {{ selectedJpCategory.category }}
            </span>
          </div>

          <div class="space-y-3">
            <div v-for="(item, iidx) in selectedJpCategory.items" :key="iidx" 
                 class="bg-white p-4 rounded-2xl shadow-sm border border-beige-200 flex items-center justify-between gap-3">
              
              <!-- 點擊文字區塊可放大 -->
              <div @click="showLargeJapanese(item)" class="flex-1 cursor-pointer">
                <div class="font-bold text-base text-beige-900 font-maru">{{ item.jp }}</div>
                <div class="text-xs text-beige-400 mt-0.5">{{ item.kana }}</div>
                <div class="text-xs font-bold text-beige-800 mt-1">{{ item.zh }}</div>
              </div>

              <!-- 播放語音與放大按鈕 -->
              <div class="flex items-center gap-1.5 flex-shrink-0">
                <button @click="speakJapanese(item.jp)" class="w-10 h-10 rounded-xl bg-accent-sage/10 hover:bg-accent-sage/20 text-accent-sage flex items-center justify-center transition active:scale-90" title="播放日文發音">
                  <i class="fa-solid fa-volume-high text-sm"></i>
                </button>
                <button @click="showLargeJapanese(item)" class="w-10 h-10 rounded-xl bg-beige-100 hover:bg-beige-200 text-beige-800 flex items-center justify-center transition active:scale-90" title="全螢幕放大">
                  <i class="fa-solid fa-expand text-sm"></i>
                </button>
              </div>

            </div>
          </div>
        </template>

      </div>

      <!-- 3. 購物清單 Tab -->
      <div v-if="currentTab === 'shopping'">
        <div class="grid grid-cols-2 gap-3 items-start">
          <div v-for="item in shoppingList" :key="item.id" class="bg-white rounded-2xl p-3 shadow-sm border border-beige-200 flex flex-col justify-between relative group h-full">
            
            <div class="flex-1">
              <div class="w-full h-32 bg-beige-100 rounded-xl overflow-hidden mb-2.5 relative flex-shrink-0">
                <img v-if="item.image" :src="item.image" class="w-full h-full object-cover">
                <div v-else class="w-full h-full flex items-center justify-center text-beige-300">
                  <i class="fa-solid fa-bag-shopping text-3xl"></i>
                </div>
              </div>

              <div class="font-bold text-sm text-beige-900 leading-snug break-words mb-1.5">{{ item.name }}</div>

              <div v-if="item.price" class="text-xs font-bold text-accent-terracotta font-maru mb-2">
                ¥ {{ Number(item.price).toLocaleString() }}
              </div>

              <div v-if="item.location" class="text-xs text-beige-800 pt-2 border-t border-beige-100 space-y-1.5">
                <div class="text-[11px] text-beige-800 break-words leading-tight flex items-start gap-1">
                  <i class="fa-solid fa-location-dot text-beige-400 mt-0.5 flex-shrink-0"></i>
                  <span>{{ item.location }}</span>
                </div>

                <button @click="openMap(item.mapUrl, item.location)" class="w-full bg-beige-100 hover:bg-beige-200 text-beige-800 px-2 py-1 rounded-xl text-[11px] font-medium flex items-center justify-center gap-1 transition">
                  <i class="fa-solid fa-compass text-accent-terracotta text-[10px]"></i> 導航地點
                </button>
              </div>
            </div>

            <button @click="openEditModal(item)" class="absolute top-2 right-2 bg-black/40 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs backdrop-blur-xs hover:bg-black/60 transition z-10">
              <i class="fa-solid fa-pen text-[10px]"></i>
            </button>

          </div>
        </div>
      </div>

      <!-- 4. 累積花費 Tab -->
      <div v-if="currentTab === 'expense'" class="space-y-4">
        <div class="bg-beige-800 text-white rounded-2xl p-5 shadow-lg text-center">
          <div class="text-xs text-beige-300 font-medium mb-1">累積總花費</div>
          <div class="text-3xl font-bold font-maru">¥ {{ totalExpense.toLocaleString() }}</div>
          <div class="text-xs text-beige-300 mt-1">約 NT$ {{ (totalExpense * 0.215).toFixed(0).toLocaleString() }}</div>
        </div>

        <div class="space-y-2">
          <div v-for="exp in expenses" :key="exp.id" class="bg-white rounded-2xl p-3 shadow-sm border border-beige-200 flex justify-between items-center gap-3">
            
            <div class="flex items-center gap-3 overflow-hidden">
              <div v-if="exp.image" @click="previewImg(exp.image)" class="w-14 h-14 rounded-xl overflow-hidden bg-beige-100 flex-shrink-0 cursor-pointer relative group">
                <img :src="exp.image" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-black/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-white text-xs">
                  <i class="fa-solid fa-magnifying-glass"></i>
                </div>
              </div>

              <div class="min-w-0">
                <div class="font-bold text-sm text-beige-900 break-words leading-snug">{{ exp.name }}</div>
                <div class="text-[11px] text-beige-400 gap-1.5 flex flex-wrap items-center mt-0.5">
                  <span class="bg-beige-100 px-1.5 py-0.5 rounded text-beige-800">{{ exp.category }}</span>
                  <span>•</span>
                  <span>{{ exp.payMethod }}</span>
                </div>
              </div>
            </div>

            <div class="flex items-center gap-2 flex-shrink-0">
              <div class="text-right">
                <div class="font-bold text-beige-900 font-maru">¥ {{ Number(exp.amount).toLocaleString() }}</div>
                <div class="text-[10px] text-beige-400">{{ exp.date }}</div>
              </div>
              <button @click="openEditModal(exp)" class="text-beige-300 hover:text-beige-800 p-1.5">
                <i class="fa-solid fa-pen text-xs"></i>
              </button>
            </div>

          </div>
        </div>
      </div>

      <!-- 5. 自駕助手 Tab -->
      <div v-if="currentTab === 'drive'" class="space-y-4">
        <div v-for="item in driveList" :key="item.id" class="bg-white rounded-2xl p-4 shadow-sm border border-beige-200 relative">
          
          <!-- A. 租車資訊卡 -->
          <template v-if="item.type === '租車'">
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs bg-beige-800 text-white px-2.5 py-0.5 rounded-md font-bold flex items-center gap-1">
                <i class="fa-solid fa-car-side"></i> 租車預約
              </span>
              <button @click="openEditModal(item)" class="text-beige-300 hover:text-beige-800 p-1">
                <i class="fa-solid fa-pen text-xs"></i>
              </button>
            </div>

            <h4 class="font-bold text-lg text-beige-900 mb-1">{{ item.company || 'Toyota Rent-a-Car' }}</h4>
            <div v-if="item.carModel" class="text-xs text-accent-terracotta font-bold mb-3">
              車號/車型：{{ item.carModel }}
            </div>

            <div class="text-xs space-y-2 text-beige-800 bg-beige-50 p-3 rounded-xl border border-beige-200/60 mb-3">
              <div v-if="item.reservationNo" class="flex items-center gap-2">
                <i class="fa-solid fa-file-contract text-beige-400 w-4"></i>
                <span>預約番號：<strong class="font-mono text-beige-900">{{ item.reservationNo }}</strong></span>
              </div>
              <div v-if="item.mapCode" class="flex items-center gap-2">
                <i class="fa-solid fa-location-crosshairs text-beige-400 w-4"></i>
                <span>MapCode：<strong class="font-mono text-beige-900">{{ item.mapCode }}</strong></span>
              </div>
              <div v-if="item.pickupTime" class="flex items-start gap-2">
                <i class="fa-solid fa-clock text-beige-400 w-4 mt-0.5"></i>
                <div>
                  <div>取車：{{ item.pickupTime }} ({{ item.pickupStore }})</div>
                  <div v-if="item.returnTime">還車：{{ item.returnTime }} ({{ item.returnStore }})</div>
                </div>
              </div>
              <div v-if="item.phone" class="flex items-center gap-2">
                <i class="fa-solid fa-phone text-beige-400 w-4"></i>
                <span>電話：{{ item.phone }}</span>
              </div>
            </div>

            <div class="flex gap-2">
              <button v-if="item.phone" @click="callPhone(item.phone)" class="flex-1 bg-beige-100 hover:bg-beige-200 text-beige-800 py-1.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1 transition">
                <i class="fa-solid fa-phone-volume text-accent-sage"></i> 撥打電話
              </button>
              <button @click="openMap(item.mapUrl, item.pickupStore || item.company)" class="flex-1 bg-beige-800 hover:bg-beige-900 text-white py-1.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1 transition">
                <i class="fa-solid fa-compass text-accent-sand"></i> 導航取車點
              </button>
            </div>
          </template>

          <!-- B. 加油站卡片 -->
          <template v-else-if="item.type === '加油'">
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs bg-red-600 text-white px-2.5 py-0.5 rounded-md font-bold flex items-center gap-1">
                <i class="fa-solid fa-gas-pump"></i> 加油資訊
              </span>
              <button @click="openEditModal(item)" class="text-beige-300 hover:text-beige-800 p-1">
                <i class="fa-solid fa-pen text-xs"></i>
              </button>
            </div>

            <h4 class="font-bold text-base text-beige-900 mb-1">{{ item.stationName || '還車前指定加油站' }}</h4>
            
            <div class="text-xs text-beige-800 space-y-1.5 mb-3">
              <div v-if="item.gasType" class="flex items-center gap-1.5">
                <span class="text-beige-400 font-medium">建議油品：</span>
                <span class="bg-red-100 text-red-700 px-2 py-0.5 rounded font-bold">{{ item.gasType }}</span>
              </div>
              <div v-if="item.mapCode" class="flex items-center gap-1.5">
                <span class="text-beige-400 font-medium">MapCode：</span>
                <span class="font-mono font-bold">{{ item.mapCode }}</span>
              </div>
              <div v-if="item.note" class="text-beige-400 italic">
                <i class="fa-solid fa-circle-info mr-1 text-accent-sage"></i>{{ item.note }}
              </div>
            </div>

          const saved = localStorage.getItem(key);

        } catch(e) { return fallback; }
      };

      const days = ref(loadSavedData('trip_days_v2', [
        { dateDisplay: '9/6 (日)' },
        { dateDisplay: '9/7 (一)' },
        { dateDisplay: '9/8 (二)' },
        { dateDisplay: '9/9 (三)' },
        { dateDisplay: '9/10 (四)' },

      const scheduleData = ref(loadSavedData('trip_schedule', {
        0: [
          { id: '1', category: '航班', flightNo: 'JX800', depAirport: 'TPE', depCn: '台北桃園', arrAirport: 'NRT', arrCn: '東京成田', depTime: '08:15', arrTime: '12:30' },
          { id: '2', category: '景點', name: '淺草寺', time: '09:00 - 17:00', ticket: '免費', note: '買人形燒', transportType: 'walk', transportTime: '約 20 分鐘' }
        ]
      }));

      const driveList = ref(loadSavedData('trip_drive', [
        { id: '1', type: '租車', company: 'Toyota Rent-a-Car', carModel: 'Yaris (小轎車)', reservationNo: 'TR-882910', mapCode: '33 157 281*00', pickupStore: '成田機場 T1 店', pickupTime: '9/6 13:30', returnStore: '成田機場 T1 店', returnTime: '9/10 16:00', phone: '+81-476-32-1020', mapUrl: '' },
        { id: '2', type: '加油', stationName: 'ENEOS 成田機場前加油站', gasType: 'Regular (赤色無鉛)', mapCode: '33 158 100*11', note: '還車前記得在此加滿油，並保留收據！', mapUrl: '' }
      ]));

      const shoppingList = ref(loadSavedData('trip_shopping', [
        { id: '1', name: '合利他命 EX Plus強效錠', price: 5980, location: '唐吉訶德 澀谷店 MEGA店', mapUrl: '', image: 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=300' }
      ]));

      const expenses = ref(loadSavedData('trip_expenses', [
        { id: '1', category: '飲食', name: '敘敘苑燒肉', amount: 12000, payMethod: '信用卡', date: '2026-09-06', image: '' }
      ]));

      // 實用日語短句清單資料 (四大情境，每組皆擴充至10句以上)
      const japanesePhrases = ref([
        {
          category: '購物與結帳',
          icon: 'fa-solid fa-basket-shopping',
          items: [
            { jp: 'いくらですか？', kana: 'Ikura desu ka?', zh: '請問這個多少錢？' },
            { jp: 'これをお願いします。', kana: 'Kore o onegai shimasu.', zh: '請幫我結帳這個。' },
            { jp: '免税できますか？', kana: 'Menzei dekimasu ka?', zh: '請問可以退稅嗎？' },
            { jp: 'クレジットカード使えますか？', kana: 'Kurejitto kādo tsukaemasu ka?', zh: '可以用信用卡嗎？' },
            { jp: '袋をいただけますか？', kana: 'Fukuro o itadakemasu ka?', zh: '可以給我有袋子嗎？' },
            { jp: '試着してもいいですか？', kana: 'Shichaku shite mo ii desu ka?', zh: '請問可以試穿嗎？' },
            { jp: '別のサイズはありますか？', kana: 'Betsu no saizu wa arimasu ka?', zh: '請問有其他尺寸嗎？' },
            { jp: '別々に会計できますか？', kana: 'Betsubetsu ni kaikei dekimasu ka?', zh: '請問可以分開結帳嗎？' },
            { jp: 'レシートをください。', kana: 'Reshīto o kudasai.', zh: '請給我收據。' },
            { jp: '見ているだけです。', kana: 'Mite iru dake desu.', zh: '我只是隨便看看。' }
          ]
        },
        {
          category: '餐廳與點餐',
          icon: 'fa-solid fa-utensils',
          items: [
            { jp: 'おすすめは何ですか？', kana: 'Osusume wa nan desu ka?', zh: '請問有什麼推薦的嗎？' },
            { jp: 'メニューをください。', kana: 'Menyū o kudasai.', zh: '請給我菜單。' },
            { jp: 'お会計お願いします。', kana: 'Okaikei onegai shimasu.', zh: '麻煩請買單。' },
            { jp: '水をいただけますか？', kana: 'Mizu o itadakemasu ka?', zh: '可以給我一杯水嗎？' },
            { jp: '牛肉が食べられません。', kana: 'Gyūniku ga taberaremasen.', zh: '我不吃牛肉。' },
            { jp: 'これと同じものをください。', kana: 'Kore to onaji mono o kudasai.', zh: '請給我一樣的品項。' },
            { jp: '英語のメニューはありますか？', kana: 'Eigo no menyū wa arimasu ka?', zh: '請問有英文菜單嗎？' },
            { jp: '氷なしでお願いします。', kana: 'Kōri nashi de onegai shimasu.', zh: '請幫我去冰。' },
            { jp: 'アレルギーがあります。', kana: 'Arerugī ga arimasu.', zh: '我有食物過敏。' },
            { jp: 'ごちそうさまでした。', kana: 'Gochisōsama deshita.', zh: '多謝款待（吃飽後說）。' }
          ]
        },
        {
          category: '問路與交通',
          icon: 'fa-solid fa-compass',
          items: [
            { jp: '〜はどこですか？', kana: '~ wa doko desu ka?', zh: '請問 ~ 在哪裡？' },
            { jp: 'トイレはどこですか？', kana: 'Toire wa doko desu ka?', zh: '請問洗手間在哪裡？' },
            { jp: '駅はどこですか？', kana: 'Eki wa doko desu ka?', zh: '請問車站在哪裡？' },
            { jp: '切符売り場はどこですか？', kana: 'Kippu uriba wa doko desu ka?', zh: '請問售票處在哪裡？' },
            { jp: 'この電車は〜に行きますか？', kana: 'Kono densha wa ~ ni ikimasu ka?', zh: '這班電車會到 ~ 嗎？' },
            { jp: '次の駅はどこですか？', kana: 'Tsugi no eki wa doko desu ka?', zh: '下一站是哪裡？' },
            { jp: 'ここで降ります。', kana: 'Koko de orimasu.', zh: '我要在這裡下車。' },
            { jp: 'タクシー乗り場はどこですか？', kana: 'Takushī noriba wa doko desu ka?', zh: '計程車搭乘處在哪裡？' },
            { jp: '道に迷いました。', kana: 'Michi ni mayoimashita.', zh: '我迷路了。' },
            { jp: '歩いて何分ですか？', kana: 'Aruite nanpun desu ka?', zh: '走路需要幾分鐘？' }
          ]
        },
        {
          category: '緊急與基本應對',
          icon: 'fa-solid fa-triangle-exclamation',
          items: [
            { jp: 'すみません / ごめんなさい', kana: 'Sumimasen / Gomennasai', zh: '不好意思 / 對不起' },
            { jp: '助けてください！', kana: 'Tasukete kudasai!', zh: '請救救我！ / 幫幫我！' },
            { jp: '英語が話せますか？', kana: 'Eigo ga hanasemasu ka?', zh: '會說英文嗎？' },
            { jp: '大丈夫です。', kana: 'Daijōbu desu.', zh: '沒關係 / 很好不需要' },
            { jp: '警察を呼んでください。', kana: 'Keisatsu o yonde kudasai.', zh: '請幫我叫警察。' },
            { jp: '病院はどこですか？', kana: 'Byōin wa doko desu ka?', zh: '請問醫院在哪裡？' },
            { jp: '財布を無くしました。', kana: 'Saifu o nakushimashita.', zh: '我把錢包弄丟了。' },
            { jp: 'パスポートを落としました。', kana: 'Pasupōto o otoshimashita.', zh: '我把護照弄丟了。' },
            { jp: '具合が悪いです。', kana: 'Guai ga warui desu.', zh: '我身體很不舒服。' },
            { jp: '日本語が少ししか話せません。', kana: 'Nihongo ga sukoshi shika hanasemasen.', zh: '我只會說一點點日文。' }
          ]
        }
      ]);

      watch(days, (val) => localStorage.setItem('trip_days_v2', JSON.stringify(val)), { deep: true });
      watch(scheduleData, (val) => localStorage.setItem('trip_schedule', JSON.stringify(val)), { deep: true });
      watch(driveList, (val) => localStorage.setItem('trip_drive', JSON.stringify(val)), { deep: true });
      watch(shoppingList, (val) => localStorage.setItem('trip_shopping', JSON.stringify(val)), { deep: true });
      watch(expenses, (val) => localStorage.setItem('trip_expenses', JSON.stringify(val)), { deep: true });

      const formData = ref({});
      const currentDaySchedule = computed(() => scheduleData.value[selectedDayIndex.value] || []);
      const totalExpense = computed(() => expenses.value.reduce((acc, cur) => acc + Number(cur.amount || 0), 0));

      const openMap = (mapUrl, name) => {
        if (mapUrl && mapUrl.trim() !== '') {
          window.open(mapUrl.trim(), '_blank');
        } else if (name && name.trim() !== '') {
          window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name.trim())}`, '_blank');
        }
      };

      const callPhone = (phone) => {
        if (phone) window.location.href = `tel:${phone.replace(/[^0-9+]/g, '')}`;
      };

      const previewImg = (src) => {
        previewImageSrc.value = src;
      };

      const showLargeJapanese = (item) => {
        largeJapaneseItem.value = item;
      };

      // 瀏覽器內建語音朗讀日文
      const speakJapanese = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel(); // 停止先前的播放
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'ja-JP';
          utterance.rate = 0.9; // 稍微放慢語速方便聽清楚
          window.speechSynthesis.speak(utterance);
        } else {
          alert('您的瀏覽器不支援語音播放功能');
        }
      };

      const addNewDay = () => {
        const input = prompt(`請輸入 Day ${days.value.length + 1} 的日期與星期：`, `9/${6 + days.value.length} (日)`);
        if (input) {
          days.value.push({ dateDisplay: input });
          selectedDayIndex.value = days.value.length - 1;
        }
      };

      const editDayDate = () => {
        const cur = days.value[selectedDayIndex.value];
        const input = prompt(`請修改 Day ${selectedDayIndex.value + 1} 的日期與星期：`, cur.dateDisplay || '9/6 (日)');
        if (input) {
          days.value[selectedDayIndex.value].dateDisplay = input;
        }
      };

      const deleteCurrentDay = () => {
        if (confirm(`確定要刪除 Day ${selectedDayIndex.value + 1} 的整天行程嗎？`)) {
          days.value.splice(selectedDayIndex.value, 1);
          delete scheduleData.value[selectedDayIndex.value];
          selectedDayIndex.value = Math.max(0, selectedDayIndex.value - 1);
        }
      };

      const uploadBanner = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (evt) => bannerUrl.value = evt.target.result;
          reader.readAsDataURL(file);
        }
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (evt) => formData.value.image = evt.target.result;
          reader.readAsDataURL(file);
        }
      };

      const getTransportIcon = (type) => {
        if (type === 'car') return 'fa-solid fa-car';
        if (type === 'bus') return 'fa-solid fa-bus';
        return 'fa-solid fa-person-walking';
      };

      const selectAddType = (type) => {
        showAddMenu.value = false;
        openAddModal(type);
      };

      const openAddModal = (type = null) => {
        isEditing.value = false;
        if (currentTab.value === 'itinerary') formData.value = { category: type || '景點' };
        else if (currentTab.value === 'drive') formData.value = { type: type || '租車' };
        else if (currentTab.value === 'expense') formData.value = { category: '飲食', payMethod: '現金' };
        else formData.value = {};
        showModal.value = true;
      };

      const openEditModal = (item) => {
        isEditing.value = true;
        formData.value = { ...item };
        showModal.value = true;
      };

      const saveData = () => {
        if (currentTab.value === 'itinerary') {
          if (!scheduleData.value[selectedDayIndex.value]) scheduleData.value[selectedDayIndex.value] = [];
          if (isEditing.value) {
            const idx = scheduleData.value[selectedDayIndex.value].findIndex(i => i.id === formData.value.id);
            if (idx !== -1) scheduleData.value[selectedDayIndex.value][idx] = { ...formData.value };
          } else {
            scheduleData.value[selectedDayIndex.value].push({ ...formData.value, id: Date.now().toString() });
          }
        } else if (currentTab.value === 'drive') {
          if (isEditing.value) {
            const idx = driveList.value.findIndex(i => i.id === formData.value.id);
            if (idx !== -1) driveList.value[idx] = { ...formData.value };
          } else {
            driveList.value.push({ ...formData.value, id: Date.now().toString() });
          }
        } else if (currentTab.value === 'shopping') {
          if (isEditing.value) {
            const idx = shoppingList.value.findIndex(i => i.id === formData.value.id);
            if (idx !== -1) shoppingList.value[idx] = { ...formData.value };
          } else {
            shoppingList.value.push({ ...formData.value, id: Date.now().toString() });
          }
        } else if (currentTab.value === 'expense') {
          if (isEditing.value) {
            const idx = expenses.value.findIndex(i => i.id === formData.value.id);
            if (idx !== -1) expenses.value[idx] = { ...formData.value };
          } else {
            expenses.value.push({ ...formData.value, id: Date.now().toString(), date: new Date().toISOString().split('T')[0] });
          }
        }
        showModal.value = false;
      };

      const confirmDelete = () => {
        if (confirm('確定要刪除這筆資料嗎？')) {
          if (currentTab.value === 'itinerary') {
            scheduleData.value[selectedDayIndex.value] = scheduleData.value[selectedDayIndex.value].filter(i => i.id !== formData.value.id);
          } else if (currentTab.value === 'drive') {
            driveList.value = driveList.value.filter(i => i.id !== formData.value.id);
          } else if (currentTab.value === 'shopping') {
            shoppingList.value = shoppingList.value.filter(i => i.id !== formData.value.id);
          } else if (currentTab.value === 'expense') {
            expenses.value = expenses.value.filter(i => i.id !== formData.value.id);
          }
          showModal.value = false;
        }
      };

      return {
        isAuthenticated, passwordInput, passwordError, checkPassword,
        currentTab, showNavMenu, showAddMenu, switchTab, bannerUrl, selectedDayIndex, days,
        scheduleData, currentDaySchedule, driveList, shoppingList, expenses, totalExpense, japanesePhrases,
        selectedJpCategory, showModal, isEditing, formData, previewImageSrc, largeJapaneseItem, uploadBanner, handleImageUpload,
        openMap, callPhone, previewImg, showLargeJapanese, speakJapanese, getTransportIcon, selectAddType, openAddModal, openEditModal, saveData, confirmDelete,
        addNewDay, editDayDate, deleteCurrentDay
      };
    }
  }).mount('#app');
</script>
</body>
</html>
